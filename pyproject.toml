[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handsonworld"
version = "0.1.0"
description = "Hand-controlled egocentric video generation and protagonist hand filtering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
fitting = ["torch>=2.0", "smplx", "human-body-prior"]
train = [
    "torch>=2.0", "torchvision", "transformers", "accelerate", "peft",
    "safetensors", "huggingface_hub", "einops", "Pillow", "pandas", "datasets", "modelscope",
    "decord", "ftfy", "imageio[ffmpeg]", "sentencepiece", "protobuf", "typing_extensions",
]
dev = ["pytest", "ruff"]
distill = ["torch>=2.6", "loguru", "tqdm"]

[project.scripts]
ego-hand-filter = "ego_hand_filter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "third_party/FastGen", "third_party/DiffSynth-Studio"]
